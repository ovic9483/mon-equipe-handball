<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Équipe Handball</title>
<style>
:root{--navy:#0d2f55;--blue:#1598cf;--orange:#f6a129;--bg:#eef3f7;--card:#fff;--line:#d8e1ea;--text:#10233c;--green:#3fb57b;--red:#e64c4c}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:560px;margin:auto;background:#f8fafc;min-height:100vh}
header{background:linear-gradient(135deg,#15578e,#0d2f55);color:white;padding:16px 12px 12px;position:sticky;top:0;z-index:20}
.title{display:flex;gap:10px;align-items:center}.icon{font-size:28px}h1{font-size:21px;margin:0}.sub{font-size:13px;opacity:.9}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}
button{font:inherit}
.action{border:0;border-radius:11px;padding:10px 6px;color:white;font-weight:800}
.green{background:var(--green)}.blue{background:#2e8df0}.red{background:var(--red)}
main{padding:10px}
.card{background:white;border-radius:16px;box-shadow:0 2px 10px rgba(16,35,60,.08);overflow:hidden;margin-bottom:12px}
.court{position:relative;width:100%;height:600px;background:linear-gradient(#21a7d8,#168fc7);border:4px solid #fff;overflow:hidden}
.zone{position:absolute;top:0;left:14%;width:72%;height:170px;background:var(--orange);border:4px solid #fff;border-top:0;border-radius:0 0 46% 46%}
.nine{position:absolute;top:90px;left:4%;width:92%;height:210px;border-bottom:5px dashed white;border-radius:0 0 48% 48%}
.goal{position:absolute;top:0;left:37%;width:26%;height:36px;border:6px solid #fff;border-top:0;z-index:4}
.pos{position:absolute;transform:translate(-50%,-50%);width:31%;min-width:105px;max-width:145px;text-align:center;z-index:6}
.lab{display:inline-block;background:var(--navy);color:#fff;font-weight:800;padding:6px 12px;border-radius:8px;margin-bottom:5px}
.slots{display:grid;grid-template-columns:1fr;gap:5px;width:100%}
select{width:100%;border:2px solid white;background:#e5f1f9;border-radius:10px;padding:10px 2px;color:var(--navy);font-weight:700;text-align:center}
.ag{left:13%;top:16%}.ad{left:87%;top:16%}.arg{left:27%;top:49%}.ard{left:73%;top:49%}.dc{left:50%;top:61%}.piv{left:50%;top:29%}.gb{left:50%;top:88%;width:44%;max-width:230px}
.midline{position:absolute;left:0;right:0;bottom:70px;height:4px;background:white}
.circle{position:absolute;left:44%;bottom:39px;width:12%;aspect-ratio:1;border:4px solid white;border-radius:50%}
.section{padding:14px}.section h2{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:8px}.row input,.search{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px}
.add{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800}
.players{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.player{position:relative;border:1px solid var(--line);background:#f8fbfd;border-radius:10px;padding:9px 22px 9px 8px;text-align:center;transition:.15s ease}.player.selected{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:800}.player.selected .x{color:#fff}.player.fixed{padding-right:8px}
.player .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:#8ea0b1;font-size:18px}
.counter{margin-top:10px;background:#eef3f7;border-radius:10px;padding:11px;text-align:center;font-weight:800}
.keepers{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px;background:linear-gradient(#eef4f9,#e5edf5)}
.kleft{font-size:18px;font-weight:800}.kslots{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:60%}
.status{font-size:11px;text-align:center;color:#708090;padding:8px}
@media(max-width:390px){.court{height:570px}.players{grid-template-columns:repeat(2,1fr)}.action{font-size:11px}.pos{min-width:92px}.lab{font-size:12px}.ag{left:13%;top:15%}.ad{left:87%;top:15%}.gb{top:89%;width:48%;}}
</style>
<meta name="theme-color" content="#0d2f55">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Équipe">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="app">
<header>
  <div class="title"><div class="icon">🤾</div><div><h1>Mon Équipe Handball</h1><div class="sub">Compose ton équipe du week-end</div></div></div>
  <div class="actions">
    <button id="goList" class="action green">👥 Ma liste</button>
    <button id="clearLineup" class="action blue">↻ Vider la compo</button>
    <button id="clearAll" class="action red">🗑 Tout effacer</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="court">
      <div class="goal"></div><div class="zone"></div><div class="nine"></div><div class="midline"></div><div class="circle"></div>

      <div class="pos ag" data-pos="AG"><div class="lab">AG</div><div class="slots"><select></select><select></select></div></div>
      <div class="pos ad" data-pos="AD"><div class="lab">AD</div><div class="slots"><select></select><select></select></div></div>
      <div class="pos arg" data-pos="ARG"><div class="lab">ARG</div><div class="slots"><select></select><select></select></div></div>
      <div class="pos ard" data-pos="ARD"><div class="lab">ARD</div><div class="slots"><select></select><select></select></div></div>
      <div class="pos dc" data-pos="DC"><div class="lab">DC</div><div class="slots"><select></select><select></select></div></div>
      <div class="pos piv" data-pos="PIV"><div class="lab">PIV</div><div class="slots"><select></select><select></select></div></div>
      <div class="pos gb" data-pos="GB"><div class="lab">🥅 GARDIENS</div><div class="slots"><select></select><select></select></div></div>
    </div>
  </div>

  <div id="list" class="card section">
    <h2>Ma liste de joueurs</h2>
    <input id="search" class="search" placeholder="Rechercher un joueur…">
    <div class="row" style="margin-top:8px">
      <input id="playerName" placeholder="Nom du joueur">
      <button id="addPlayer" class="add">Ajouter</button>
    </div>
    <div id="players" class="players"></div>
    <div id="counter" class="counter">0 joueur sélectionné</div>
  </div>

  <div id="status" class="status">Initialisation…</div>
</main>
</div>

<script>
(function(){
  var CKEY='hb_custom_players_v6', LKEY='hb_lineup_v5';
  var DEFAULT_PLAYERS=[
    'Arnaud','Brachet','Calviac','Cédric','Christo','Eddy','Hugo','Joffrey',
    'Landry','Loup','Manouba','Micka','Nico','Ovic','Pad','Peter','Yougo'
  ];
  var customPlayers=[], players=[], lineup={};

  function safeGet(key, fallback){
    try{
      var v=localStorage.getItem(key);
      return v ? JSON.parse(v) : fallback;
    }catch(e){ return fallback; }
  }
  function safeSet(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
  }

  customPlayers=safeGet(CKEY,[]);
  lineup=safeGet(LKEY,{});

  function rebuildPlayers(){
    var seen={};
    players=DEFAULT_PLAYERS.concat(customPlayers).filter(function(name){
      var k=String(name).toLowerCase();
      if(seen[k]) return false;
      seen[k]=true;
      return true;
    });
    players.sort(function(a,b){return a.localeCompare(b,'fr');});
  }
  rebuildPlayers();

  var playerName=document.getElementById('playerName');
  var search=document.getElementById('search');
  var playersEl=document.getElementById('players');
  var counter=document.getElementById('counter');
  var status=document.getElementById('status');

  function save(){
    safeSet(CKEY,customPlayers);
    safeSet(LKEY,lineup);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function getSelectedPlayers(){
    var s=new Set();
    Object.keys(lineup).forEach(function(k){
      (lineup[k]||[]).forEach(function(n){ if(n) s.add(n); });
    });
    return s;
  }

  function renderPlayers(){
    var q=(search.value||'').trim().toLowerCase();
    var selected=getSelectedPlayers();
    playersEl.innerHTML='';
    players.filter(function(n){return n.toLowerCase().indexOf(q)!==-1;}).forEach(function(name){
      var div=document.createElement('div');
      var isFixed=DEFAULT_PLAYERS.some(function(p){return p.toLowerCase()===name.toLowerCase();});
      div.className='player'+(selected.has(name)?' selected':'')+(isFixed?' fixed':'');
      div.innerHTML='<span>'+esc(name)+'</span>'+(isFixed?'':'<button class="x" type="button" aria-label="Supprimer '+esc(name)+'">×</button>');
      if(!isFixed){
        div.querySelector('.x').addEventListener('click',function(){
          customPlayers=customPlayers.filter(function(p){return p.toLowerCase()!==name.toLowerCase();});
          Object.keys(lineup).forEach(function(pos){
            lineup[pos]=(lineup[pos]||[]).map(function(v){return v===name?'':v;});
          });
          rebuildPlayers();
          save(); renderPlayers(); renderSelects();
        });
      }
      playersEl.appendChild(div);
    });
  }

  function renderSelects(){
    document.querySelectorAll('[data-pos]').forEach(function(block){
      var pos=block.getAttribute('data-pos');
      if(!lineup[pos]) lineup[pos]=['',''];
      var sels=block.querySelectorAll('select');
      sels.forEach(function(sel,i){
        var current=lineup[pos][i]||'';
        sel.innerHTML='';
        var empty=document.createElement('option'); empty.value=''; empty.textContent='+'; sel.appendChild(empty);
        players.forEach(function(name){
          var o=document.createElement('option');
          o.value=name; o.textContent=name;
          if(name===current) o.selected=true;
          sel.appendChild(o);
        });
        sel.value=current;
        sel.onchange=function(){
          lineup[pos][i]=sel.value;
          save(); updateCounter(); renderPlayers();
        };
      });
    });
    save(); updateCounter();
  }

  function updateCounter(){
    var s=new Set();
    Object.keys(lineup).forEach(function(k){
      (lineup[k]||[]).forEach(function(n){if(n)s.add(n);});
    });
    var c=s.size;
    counter.textContent=c+' joueur'+(c>1?'s':'')+' sélectionné'+(c>1?'s':'');
  }

  function addPlayer(){
    var name=(playerName.value||'').trim();
    if(!name)return;
    var exists=players.some(function(p){return p.toLowerCase()===name.toLowerCase();});
    if(!exists){
      customPlayers.push(name);
      rebuildPlayers();
    }
    playerName.value='';
    save(); renderPlayers(); renderSelects();
  }

  document.getElementById('addPlayer').addEventListener('click',addPlayer);
  playerName.addEventListener('keydown',function(e){if(e.key==='Enter')addPlayer();});
  search.addEventListener('input',renderPlayers);

  document.getElementById('goList').addEventListener('click',function(){
    document.getElementById('list').scrollIntoView({behavior:'smooth',block:'start'});
  });

  document.getElementById('clearLineup').addEventListener('click',function(){
    lineup={}; save(); renderSelects(); renderPlayers();
  });

  document.getElementById('clearAll').addEventListener('click',function(){
    customPlayers=[]; lineup={}; rebuildPlayers(); save(); renderPlayers(); renderSelects();
  });

  renderPlayers(); renderSelects();
  status.textContent='Application prête ✓';
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
